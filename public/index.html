<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rexify Automation Control</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.3/index.css">
<style>
  :root{
    --black: #000000;
    --grey-950: #0a0a0a;
    --grey-900: #111111;
    --grey-800: #1a1a1a;
    --grey-700: #262626;
    --grey-500: #737373;
    --grey-300: #a3a3a3;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--black);
  }

  body {
    font-family: 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    width: 100%;
  }

  .header {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-bottom: 10px;
  }

  h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  form { display: block; }

  .dropzone-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }

  @media (max-width: 480px) {
    .dropzone-grid { grid-template-columns: 1fr; }
  }

  .dropzone {
    position: relative;
    border: 2px dashed var(--grey-700);
    border-radius: 16px;
    height: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    background: var(--grey-950);
    padding: 0 16px;
    text-align: center;
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--white);
    background: var(--grey-900);
  }

  .dropzone.has-file {
    border-style: solid;
    border-color: var(--white);
    background: var(--grey-900);
  }

  .plus-ring {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--grey-500);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .dropzone:hover .plus-ring, .dropzone.dragover .plus-ring {
    border-color: var(--white);
    transform: scale(1.06);
  }

  .plus-ring svg { width: 20px; height: 20px; }

  .dz-title {
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .dz-sub {
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--grey-500);
    margin-top: 6px;
  }

  .dz-tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey-500);
    position: absolute;
    top: 14px;
    left: 16px;
  }

  input[type="file"] { display: none; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease, border-color 0.15s ease, color 0.15s ease;
  }

  #startBtn {
    background: var(--white);
    color: var(--black);
  }

  #startBtn:hover { opacity: 0.85; }
  #startBtn:active { transform: scale(0.99); }

  #startBtn:disabled {
    background: var(--grey-700);
    color: var(--grey-500);
    cursor: not-allowed;
    opacity: 1;
  }

  #stopBtn {
    background: transparent;
    color: var(--grey-500);
    border: 1.5px solid var(--grey-700);
  }

  #stopBtn:hover:not(:disabled) {
    color: var(--white);
    border-color: var(--white);
  }

  #stopBtn:active:not(:disabled) { transform: scale(0.99); }

  #stopBtn:disabled {
    color: var(--grey-700);
    border-color: var(--grey-800);
    cursor: not-allowed;
  }

  .terminal-section {
    margin-top: 40px;
  }

  .terminal-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--grey-500);
  }

  .terminal {
    background: var(--grey-900);
    border: 1px solid var(--grey-800);
    border-radius: 12px;
    padding: 18px 20px;
    font-family: 'SF Mono', 'Geist Mono', ui-monospace, monospace;
    height: 340px;
    overflow-y: auto;
    font-size: 0.82rem;
    line-height: 1.7;
  }

  .terminal::-webkit-scrollbar { width: 8px; }
  .terminal::-webkit-scrollbar-thumb { background: var(--grey-700); border-radius: 8px; }
  .terminal::-webkit-scrollbar-track { background: transparent; }

  .log-line {
    color: var(--grey-300);
    word-break: break-word;
  }

  .log-line .ts {
    color: var(--grey-500);
    margin-right: 10px;
  }

  .log-info { color: var(--white); }
  .log-error { color: var(--grey-300); font-weight: 700; }
  .log-error::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--white);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="eyebrow">Rexify / Automation</div>
      <h1>Automation control</h1>
    </div>

    <form id="uploadForm">
      <div class="dropzone-grid">
        <label for="accountsFile">
          <div class="dropzone" id="accountsZone">
            <span class="dz-tag">accounts.csv</span>
            <div class="plus-ring">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <div class="dz-title" id="accountsTitle">Upload account details</div>
            <div class="dz-sub" id="accountsSub">Bank name and account number</div>
          </div>
        </label>
        <label for="urlsFile">
          <div class="dropzone" id="urlsZone">
            <span class="dz-tag">urls.csv</span>
            <div class="plus-ring">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <div class="dz-title" id="urlsTitle">Upload target URLs</div>
            <div class="dz-sub" id="urlsSub">One URL per row</div>
          </div>
        </label>
      </div>
      <input type="file" id="accountsFile" accept=".csv" required />
      <input type="file" id="urlsFile" accept=".csv" required />
      <div class="btn-row">
        <button type="submit" id="startBtn">Start automation</button>
        <button type="button" id="stopBtn" disabled>Stop</button>
      </div>
    </form>

    <div class="terminal-section">
      <div class="terminal-label"><span class="dot"></span>Live output</div>
      <div class="terminal" id="terminal">
        <div class="log-line log-info"><span class="ts">00:00:00</span>System ready. Upload a CSV to begin.</div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const form = document.getElementById('uploadForm');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    function appendLog(text, type = '') {
      const line = document.createElement('div');
      line.className = 'log-line ' + (type ? `log-${type}` : '');
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = new Date().toLocaleTimeString('en-GB');
      line.appendChild(ts);
      line.appendChild(document.createTextNode(text));
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function wireDropzone({ zoneId, inputId, titleId, subId, readyLabel }) {
      const zone = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      const title = document.getElementById(titleId);
      const sub = document.getElementById(subId);

      input.addEventListener('change', () => {
        if (input.files[0]) {
          zone.classList.add('has-file');
          title.textContent = input.files[0].name;
          sub.textContent = readyLabel;
        }
      });

      ['dragover', 'dragleave', 'drop'].forEach(evt => {
        zone.addEventListener(evt, (e) => {
          e.preventDefault();
          if (evt === 'dragover') zone.classList.add('dragover');
          else zone.classList.remove('dragover');
        });
      });

      zone.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file) {
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event('change'));
        }
      });
    }

    wireDropzone({
      zoneId: 'accountsZone', inputId: 'accountsFile',
      titleId: 'accountsTitle', subId: 'accountsSub',
      readyLabel: 'Ready to upload'
    });
    wireDropzone({
      zoneId: 'urlsZone', inputId: 'urlsFile',
      titleId: 'urlsTitle', subId: 'urlsSub',
      readyLabel: 'Ready to upload'
    });

    function setRunningState(isRunning) {
      startBtn.disabled = isRunning;
      startBtn.textContent = isRunning ? 'Running...' : 'Start automation';
      stopBtn.disabled = !isRunning;
    }

    let eventSource;
    try {
      eventSource = new EventSource('/api/logs');
      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        appendLog(data.message, data.type);
        if (data.done) setRunningState(false);
      };
    } catch (e) {}

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const accountsFile = document.getElementById('accountsFile');
      const urlsFile = document.getElementById('urlsFile');
      if (!accountsFile.files[0] || !urlsFile.files[0]) return;

      const formData = new FormData();
      formData.append('accountsFile', accountsFile.files[0]);
      formData.append('urlsFile', urlsFile.files[0]);

      setRunningState(true);
      appendLog('Uploading files and starting task loop...', 'info');

      try {
        const response = await fetch('/api/start', { method: 'POST', body: formData });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
          setRunningState(false);
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
        setRunningState(false);
      }
    });

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      stopBtn.textContent = 'Stopping...';
      appendLog('Stop signal sent. Waiting for current task to finish...', 'info');

      try {
        const response = await fetch('/api/stop', { method: 'POST' });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
      } finally {
        stopBtn.textContent = 'Stop';
        setRunningState(false);
      }
    });

    // Sync UI state on page load/refresh
    async function syncServerStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        if (data.isRunning) {
          startBtn.disabled = true;
          startBtn.textContent = 'Running...';
          stopBtn.disabled = data.isStopping; // keep enabled unless already stopping
          stopBtn.textContent = data.isStopping ? 'Stopping...' : 'Stop';
        } else {
          startBtn.disabled = false;
          startBtn.textContent = 'Start automation';
          stopBtn.disabled = true;
          stopBtn.textContent = 'Stop';
        }
      } catch (err) {
        console.error('Failed to sync status:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', syncServerStatus);
  </script>
</body>
</html>      <div class="terminal" id="terminal">
        <div class="log-line log-info">> System ready. Upload your CSV file to begin automation...</div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const form = document.getElementById('uploadForm');
    const startBtn = document.getElementById('startBtn');

    function appendLog(text, type = '') {
      const line = document.createElement('div');
      line.className = 'log-line ' + (type ? `log-${type}` : '');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    const eventSource = new EventSource('/api/logs');
    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      appendLog(data.message, data.type);
      if (data.done) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Automation';
      }
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('csvFile');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('csvFile', fileInput.files[0]);

      startBtn.disabled = true;
      startBtn.textContent = 'Running Automation...';
      appendLog('Uploading CSV file and kicking off task loop...', 'info');

      try {
        const response = await fetch('/api/start', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
          startBtn.disabled = false;
          startBtn.textContent = 'Start Automation';
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Start Automation';
      }
    });
  </script>
</body>
</html>
